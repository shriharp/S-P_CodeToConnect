[project]
name = "risk-engine-backend"
version = "0.1.0"
description = "NLP financial risk signal engine backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Opt-in model sentiment backend (Apache-2.0 checkpoint; see docs/model-evaluation.md).
# CPU-only torch keeps the wheel small; ~420 MB peak RSS at inference.
model = [
    "torch>=2.2",
    "transformers>=4.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
